prefix = " <color:#f5a5a5><bold>T <dark_gray>»<reset>"

ticket {
    header = " <gray><strikethrough>      </strikethrough></gray> <ticket_id> <gray>-</gray> <ticket_format> <gray><strikethrough>      </strikethrough></gray> "
    subheader = " <gray>by</gray> <ticket_creator> <gray>on</gray> <ticket_date>"
    data = " <yellow><identifier></yellow> <newline> <content>"
    timeline = {
        header = " <gray><strikethrough>      </strikethrough></gray> Timeline <gray><strikethrough>      </strikethrough></gray> "
        entry = " <gray>•</gray> <yellow><title></yellow> <gray>by</gray> <creator> <gray>on</gray> <date>"
    }
    status = {
        unclaimed = " <gray>currently</gray> <ticket_status>"
        claimed = " <gray>currently</gray> <ticket_status> <gray>by</gray> <ticket_assignee>"
    }
}

feedback {
    user {
        create = "<prefix> Ticket <ticket_id> created!"
        list_header = " <gray><strikethrough>      </strikethrough></gray> Your Tickets <gray><strikethrough>      </strikethrough></gray> "
        list_empty = " <gray>No tickets found.</gray>"
        list_entry = "  <ticket_id> <gray>-</gray> <ticket_format> <gray>currently</gray> <ticket_status>"
        comment = "<prefix> Added a comment to <ticket_id>."
        close = "<prefix> Closed <ticket_id>."
    }

    staff {
        list_header = " <gray><strikethrough>      </strikethrough></gray> Tickets <gray><strikethrough>      </strikethrough></gray> "
        list_empty = " <gray>No tickets found.</gray>"
        list_group = " <yellow><name></yellow>"
        list_entry = "  <ticket_id> <gray>by</gray> <ticket_creator>"
        claim = "<prefix> Claimed <ticket_id>."
        assign = "<prefix> Assigned <ticket_id> to <ticket_assignee>"
        unclaim = "<prefix> Unclaimed <ticket_id>."
        close = "<prefix> Closed <ticket_id>"
        reopen = "<prefix> Reopened <ticket_id>."
        note = "<prefix> Added a note to <ticket_id>."
        teleport = "<prefix> Teleporting to <ticket_id>."
        teleport_missing_location = "<prefix> <red><ticket_id> does not have a location.</red>"
    }

    admin {
        average_lifespan = "<prefix> Average ticket lifespan: <duration>."
    }

    error {
        invalid_ticket = "<prefix> <red>That ticket id is invalid.</red>"
        ticket_not_found = "<prefix> <red>No matching ticket was found.</red>"
        invalid_profile = "<prefix> <red>That player name is invalid.</red>"
        profile_not_found = "<prefix> <red>No matching player profile was found.</red>"
        ticket_type_not_found = "<prefix> <red>No matching ticket type was found.</red>"
    }
}

notification {
    staff {
        created = "<prefix> <ticket_id> was created by <ticket_creator>."
        commented = "<prefix> <ticket_id> received a new note."
        claimed = "<prefix> <ticket_id> was claimed by <ticket_assignee>."
        assigned = "<prefix> <ticket_id> was assigned to <ticket_assignee>."
        unclaimed = "<prefix> <ticket_id> was unclaimed."
        closed = "<prefix> <ticket_id> was closed."
        reopened = "<prefix> <ticket_id> was reopened."
    }
}
